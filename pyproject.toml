[project]
name = "event-bus"
version = "0.1.0.dev1"
authors = [
  { name="Oleg Zamesov", email="o.zamesov@yandex.ru" },
]
dependencies = [
    "Django>=3.2",
    "pika>=1.2.0",
]
description = ""
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 4 - Beta",
]
[tool.setuptools.packages.find]
include = ["django_event_bus*"]
exclude = ["infra*"]

[project.urls]
Homepage = "https://github.com/LLC-Polipak/event-bus"
AuthorGitHub = "https://github.com/Zamesov26"

[tool.ruff]
line-length = 88
extend-exclude = [
    "**/migrations/**",
    "**/tests.py",
    "**/tests/**",
    "**/__pycache__/**",
    ".venv/",
    "venv/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".ruff_cache/",
]

[tool.ruff.lint]
ignore = [
    "E501",
    "D105",  # Magic methods are self-describing.
    "D107",  # Constructor arguments are described by the class and signature.
]
select = [
    "A", # flake8-builtins
    "E", # pycodestyle
    "F", # Pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "I", # isort
    "C", # flake8-comprehensions
    "D", # pydocstyle
    "LOG", # flake8-logging
    "PIE", # flake8-pie
    "PT", # flake8-pytest-style
    "RET", # flake8-return
    "RUF100", # unused-noqa
    "S", # flake8-bandit
    "T100", # flake8-debugger
    "W", # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"
